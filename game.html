  <title>Play Zombie in My Pocket in your browser</title>
  <meta name="description" content="Play Zombie in My Pocket: a solo zombie survival game of room-by-room exploration against the clock.">
  <link rel="canonical" href="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="csiesheep games">
  <meta property="og:title" content="Play Zombie in My Pocket">
  <meta property="og:description" content="A solo zombie survival game against the clock. Find the relic, bury it in the family plot before midnight.">
  <meta property="og:url" content="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <!-- Absolute, because crawlers do not reliably resolve relative OG paths, and
       a new filename rather than a new picture at the old one — scrapers cache
       by URL, so replacing the image in place would leave every link that has
       ever been shared showing the old card. -->
  <meta property="og:image" content="https://games.csiesheep.com/zombie_in_the_pocket/assets/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A dark house at night, lit windows and an open door, under the title Zombie in My Pocket.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Play Zombie in My Pocket">
  <meta name="twitter:description" content="A solo zombie survival game against the clock. Find the relic, bury it in the family plot before midnight.">
  <meta name="twitter:image" content="https://games.csiesheep.com/zombie_in_the_pocket/assets/social.png">
  <meta name="twitter:image:alt" content="A dark house at night, lit windows and an open door, under the title Zombie in My Pocket.">

  <!-- The trail, so a search result shows "Zombie in My Pocket > Play" rather than a
       bare URL. Positions are the real hierarchy: everything on this site is one
       click from the menu. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Zombie in My Pocket", "item": "https://games.csiesheep.com/zombie_in_the_pocket/" },
      { "@type": "ListItem", "position": 2, "name": "Play", "item": "https://games.csiesheep.com/zombie_in_the_pocket/game" }
    ]
  }
  </script>
</head>
<body class="app">
  <header class="topnav">
    <a class="brand" href="index.html">Zombie in My Pocket</a>
    <span class="spacer"></span>
    <a href="rulebook.html">Rulebook</a>
    <a href="index.html">Menu</a>
  </header>


  <main class="game-layout">
    <!-- The app had no h1 anywhere: the brand in the top bar is a link back to
         the menu, not a heading, and a page with no h1 is a page a crawler and a
         screen reader both have to guess the subject of. Off-screen rather than
         drawn, because the board is the title here — the header already says the
         name and a second visible one would be furniture. -->
    <h1 class="sr-only">Zombie in My Pocket — play in your browser</h1>
    <section class="board-pane" aria-label="Board">
      <div class="board" id="board" role="group" aria-label="Game board"></div>
      <div class="actions-pop" id="actions-pop" role="group" aria-label="Your move" hidden>
        <div id="actions"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel panel--status">
        <div class="clockbox" id="hud-hour"></div>
        <div class="statgrid">
          <div class="stat"><span class="statlabel">Health</span><span class="statval" id="hud-health"></span></div>
          <div class="stat"><span class="statlabel">Attack</span><span class="statval" id="hud-attack"></span></div>
          <div class="stat"><span class="statlabel">Relic</span><span class="statval" id="hud-totem"></span></div>
        </div>
      </div>
      <div class="panel">
        <h3>Backpack</h3>
        <div class="backpack" id="hud-items"></div>
      </div>
      <div class="panel utility">
        <p class="runline">Seed <code id="seed-value">&mdash;</code></p>
        <div class="utilrow">
          <button class="utilbtn" type="button" id="btn-sound" aria-pressed="false" title="Sound">
            <span class="soundicon" id="sound-icon"></span><span class="sr-only" id="sound-label">Sound off</span>
          </button>
          <button class="utilbtn" type="button" id="btn-note" title="The note from the hall">
            <span class="utilicon" id="note-icon">✉</span><span class="sr-only">Read the note again</span>
          </button>
          <button class="utilbtn" type="button" id="btn-calm" aria-pressed="false"
                  title="Calm mode — the game without the scares">
            <span class="utilicon" id="calm-icon"></span><span class="sr-only" id="calm-label">Calm mode off</span>
          </button>
          <button class="utilbtn" type="button" id="btn-fullscreen" aria-pressed="false"
                  title="Fullscreen" hidden>
            <span class="utilicon" id="fs-icon">⛶</span><span class="sr-only" id="fs-label">Fullscreen</span>
          </button>
          <button class="utilbtn" type="button" id="btn-copy-seed" title="Copy replay link">
            <span class="utilicon" id="copy-icon"></span><span class="sr-only">Copy replay link</span>
          </button>
          <button class="utilbtn utilbtn--wide" type="button" id="btn-new-game">New game</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- The log panel is gone (it repeated what the board, the hearts and the
       clock already say), but it was also the only spoken narration of events.
       This is where log() writes now: unseen, still announced. -->
  <div class="sr-only" id="log" role="log" aria-live="polite" aria-label="Game narration"></div>

  <!-- Cinema bars for the set-pieces. Empty and inert until body.staged. -->
  <div class="letterbox letterbox--top" aria-hidden="true"></div>
  <div class="letterbox letterbox--bottom" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
